[project]
name = "nashr"
version = "0.1.0"
description = "Source-grounded academic production platform for Uzbekistan"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiogram>=3.0",
    "pydantic>=2.0",
    "supabase>=2.9.0",
    "redis[hiredis]>=5.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.1",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "magika>=0.6.0",
    "pytesseract>=0.3.10",
    "anthropic>=0.40.0",
    "google-genai>=2.0.0",
    "feedparser>=6.0.11",
    "python-jose[cryptography]>=3.3.0",
    "arq>=0.26.0",
    "boto3>=1.35.0",
    "Pillow>=10.0.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
# Exact pins, identical to requirements-dev.txt (what CI installs).
dev = [
    "docker==7.1.0",
    "ruff==0.15.12",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov>=5.0.0",
    # Real-PostgreSQL suite (tests/db), run in CI.
    "asyncpg==0.32.0",
    "hypothesis==6.169.0",
    "reportlab==4.5.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*"]

[tool.pyright]
include = ["packages", "tests"]
exclude = ["**/__pycache__", "**/node_modules", "packages/web"]
strict = ["packages/core", "packages/api", "packages/bot", "packages/workers", "packages/academic"]
pythonVersion = "3.13"
pythonPlatform = "Windows"
typeCheckingMode = "strict"
reportMissingImports = "error"
reportMissingTypeStubs = "warning"
# Third-party libraries without type stubs (magika, pytesseract,
# feedparser, python-pptx). Strict mode would otherwise flag every call
# as reportUnknownMemberType. Per-call # pyright: ignore comments are
# used at the boundary where these libraries are wrapped into typed
# pydantic models, so the rest of the codebase stays strict.
reportUntypedFunctionDecorator = "warning"
reportUntypedBaseClass = "warning"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -ra"

[tool.coverage.run]
source = ["packages"]
omit = ["*/tests/*", "*/__init__.py"]
