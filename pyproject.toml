[project]
name = "nashr"
version = "0.1.0"
description = "Source-grounded academic production platform for Uzbekistan"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiogram>=3.0",
    "pydantic>=2.0",
    "supabase>=2.9.0",
    "redis[hiredis]>=5.0",
    "httpx>=0.27.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "magika>=0.6.0",
    "pytesseract>=0.3.10",
    "anthropic>=0.40.0",
    "google-generativeai>=0.8.0",
    "feedparser>=6.0.11",
    "python-jose[cryptography]>=3.3.0",
    "arq>=0.26.0",
    "boto3>=1.35.0",
    "Pillow>=10.0.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pyright>=1.1.380",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*"]

[tool.pyright]
include = ["packages", "tests"]
exclude = ["**/__pycache__", "**/node_modules", "packages/web"]
strict = ["packages/core", "packages/api", "packages/bot", "packages/workers", "packages/academic"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingImports = "error"
reportMissingTypeStubs = "warning"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -ra"

[tool.coverage.run]
source = ["packages"]
omit = ["*/tests/*", "*/__init__.py"]
