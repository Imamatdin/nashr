<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Nashr</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --tg-theme-bg-color: #ffffff;
      --tg-theme-text-color: #000000;
      --tg-theme-hint-color: #999999;
      --tg-theme-link-color: #2481cc;
      --tg-theme-button-color: #2481cc;
      --tg-theme-button-text-color: #ffffff;
      --tg-theme-secondary-bg-color: #f0f0f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      padding: 16px;
      padding-bottom: 96px;
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 24px;
      line-height: 1.3;
    }

    .question {
      margin-bottom: 28px;
      transition: opacity 0.2s ease, max-height 0.2s ease;
    }

    .question.hidden {
      display: none;
    }

    .question-label {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--tg-theme-text-color);
    }

    .question-help {
      font-size: 13px;
      color: var(--tg-theme-hint-color);
      margin-bottom: 8px;
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      border: 1.5px solid var(--tg-theme-hint-color);
      background: transparent;
      color: var(--tg-theme-text-color);
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: inherit;
    }

    .pill:active {
      transform: scale(0.96);
    }

    .pill.selected {
      background: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);
      border-color: var(--tg-theme-button-color);
    }

    .pill.decide {
      font-style: italic;
      border-style: dashed;
    }

    .pill.decide.selected {
      border-style: solid;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slider-container input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: var(--tg-theme-hint-color);
      outline: none;
    }

    .slider-container input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--tg-theme-button-color);
      cursor: pointer;
    }

    .slider-container input[type="range"]::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--tg-theme-button-color);
      cursor: pointer;
      border: none;
    }

    .slider-value {
      font-size: 16px;
      font-weight: 600;
      min-width: 30px;
      text-align: center;
    }

    .slider-hint {
      font-size: 12px;
      color: var(--tg-theme-hint-color);
      margin-top: 4px;
    }

    .text-input {
      width: 100%;
      padding: 12px;
      border: 1.5px solid var(--tg-theme-hint-color);
      border-radius: 12px;
      font-size: 14px;
      background: var(--tg-theme-secondary-bg-color);
      color: var(--tg-theme-text-color);
      outline: none;
      resize: vertical;
      min-height: 48px;
      font-family: inherit;
    }

    .text-input:focus {
      border-color: var(--tg-theme-button-color);
    }

    .text-input::placeholder {
      color: var(--tg-theme-hint-color);
    }

    #submit-btn {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      background: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }

    #submit-btn:active {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div id="app">
    <h1 id="title"></h1>
    <div id="questions"></div>
    <button id="submit-btn" type="button"></button>
  </div>

        interactive: "Interaktiv elementler qosılsın ba?",
        interactive_yes: "Awa (viktorina, moslashtırıw)",
        interactive_no: "Yaq (tek kontent)",
        theme: "Vizual tema",
        theme_light: "Jarıq fon",
        theme_dark: "Qaranǵı fon",
        notes: "Spiker jazbaları",
        notes_full: "Tolıq tekst",
        notes_brief: "Qısqa tezisler",
        notes_none: "Kerek emes",

    var L = LABELS[lang] || LABELS['uz'];

    // ============ STATE ============

    var state = {
      audience: 'decide_for_me',
      duration: 15,
      emphasis: [],
      title_style: 'decide_for_me',
      include_interactive: 'decide_for_me',
      theme: 'decide_for_me',
      speaker_notes: 'decide_for_me',
      headline_numbers: '',
      closing_ask: '',
      diagrams: 'decide_for_me'
    };

    // ============ UTIL ============

    function esc(str) {
      var div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    // ============ UI BUILDERS ============

    function buildSingleSelect(key, label, options) {
      var div = document.createElement('div');
      div.className = 'question';

      var lbl = document.createElement('div');
      lbl.className = 'question-label';
      lbl.textContent = label;
      div.appendChild(lbl);

      var pills = document.createElement('div');
      pills.className = 'pills';

      options.forEach(function(opt) {
        var pill = document.createElement('button');
        pill.type = 'button';
        pill.className = 'pill' + (opt.isDecide ? ' decide' : '') + (state[key] === opt.value ? ' selected' : '');
        pill.textContent = opt.label;
        pill.onclick = function() {
          state[key] = opt.value;
          var siblings = pills.querySelectorAll('.pill');
          for (var i = 0; i < siblings.length; i++) {
            siblings[i].classList.remove('selected');
          }
          pill.classList.add('selected');
          onStateChange();
        };
        pills.appendChild(pill);
      });

      div.appendChild(pills);
      return div;
    }

    function buildMultiSelect(key, label, options, maxSelect) {
      var div = document.createElement('div');
      div.className = 'question';

      var lbl = document.createElement('div');
      lbl.className = 'question-label';
      lbl.textContent = label;
      div.appendChild(lbl);

      var pills = document.createElement('div');
      pills.className = 'pills';

      options.forEach(function(opt) {
        var pill = document.createElement('button');
        pill.type = 'button';
        pill.className = 'pill' + (opt.isDecide ? ' decide' : '');
        if (state[key].indexOf(opt.value) !== -1) pill.classList.add('selected');
        pill.textContent = opt.label;

        pill.onclick = function() {
          if (opt.value === 'decide_for_me') {
            state[key] = ['decide_for_me'];
            var siblings = pills.querySelectorAll('.pill');
            for (var i = 0; i < siblings.length; i++) {
              siblings[i].classList.remove('selected');
            }
            pill.classList.add('selected');
          } else {
            state[key] = state[key].filter(function(v) { return v !== 'decide_for_me'; });
            var decidePill = pills.querySelector('.decide');
            if (decidePill) decidePill.classList.remove('selected');

            var idx = state[key].indexOf(opt.value);
            if (idx !== -1) {
              state[key].splice(idx, 1);
              pill.classList.remove('selected');
            } else if (state[key].length < maxSelect) {
              state[key].push(opt.value);
              pill.classList.add('selected');
            }
          }
          onStateChange();
        };

        pills.appendChild(pill);
      });

      div.appendChild(pills);
      return div;
    }

    function buildSlider(key, label, min, max, defaultVal, hintTemplate) {
      var div = document.createElement('div');
      div.className = 'question';

      var lbl = document.createElement('div');
      lbl.className = 'question-label';
      lbl.textContent = label;
      div.appendChild(lbl);

      var container = document.createElement('div');
      container.className = 'slider-container';

      var minSpan = document.createElement('span');
      minSpan.textContent = String(min);
      container.appendChild(minSpan);

      var slider = document.createElement('input');
      slider.type = 'range';
      slider.min = String(min);
      slider.max = String(max);
      slider.value = String(defaultVal);
      container.appendChild(slider);

      var maxSpan = document.createElement('span');
      maxSpan.textContent = String(max);
      container.appendChild(maxSpan);

      var valueSpan = document.createElement('span');
      valueSpan.className = 'slider-value';
      valueSpan.textContent = String(defaultVal);
      container.appendChild(valueSpan);

      div.appendChild(container);

      var hint = document.createElement('div');
      hint.className = 'slider-hint';
      hint.textContent = hintTemplate.replace('{n}', String(defaultVal));
      div.appendChild(hint);

      slider.addEventListener('input', function(e) {
        var val = parseInt(e.target.value, 10);
        state[key] = val;
        valueSpan.textContent = String(val);
        hint.textContent = hintTemplate.replace('{n}', String(val));
      });

      state[key] = defaultVal;
      return div;
    }

    function buildTextInput(key, label, helpText) {
      var div = document.createElement('div');
      div.className = 'question';

      var lbl = document.createElement('div');
      lbl.className = 'question-label';
      lbl.textContent = label;
      div.appendChild(lbl);

      if (helpText) {
        var help = document.createElement('div');
        help.className = 'question-help';
        help.textContent = helpText;
        div.appendChild(help);
      }

      var textarea = document.createElement('textarea');
      textarea.className = 'text-input';
      textarea.placeholder = '...';
      textarea.value = state[key] || '';
      textarea.addEventListener('input', function(e) {
        state[key] = e.target.value;
      });
      div.appendChild(textarea);

      return div;
    }

    // ============ RENDER ============

    function render() {
      document.getElementById('title').textContent = L.title;
      document.getElementById('submit-btn').textContent = L.submit;

      var container = document.getElementById('questions');
      container.innerHTML = '';

      container.appendChild(buildSingleSelect('audience', L.audience, [
        { value: 'school', label: L.audience_school },
        { value: 'undergraduate', label: L.audience_undergrad },
        { value: 'graduate', label: L.audience_grad },
        { value: 'academic_conference', label: L.audience_conference },
        { value: 'mixed_academic_industry', label: L.audience_mixed },
        { value: 'professional', label: L.audience_professional },
        { value: 'general_public', label: L.audience_public },
        { value: 'decide_for_me', label: L.decide, isDecide: true }
      ]));

      container.appendChild(buildSlider('duration', L.duration, 5, 45, 15, L.duration_hint));

      container.appendChild(buildMultiSelect('emphasis', L.emphasis, [
        { value: 'problem_framing', label: L.emphasis_problem },
        { value: 'technical_mechanism', label: L.emphasis_technical },
        { value: 'methodology', label: L.emphasis_methodology },
        { value: 'results_numbers', label: L.emphasis_results },
        { value: 'roadmap_scalability', label: L.emphasis_roadmap },
        { value: 'decide_for_me', label: L.decide, isDecide: true }
      ], 2));

      container.appendChild(buildSingleSelect('title_style', L.title_style, [
        { value: 'topic', label: L.title_topic },
        { value: 'takeaway', label: L.title_takeaway },
        { value: 'decide_for_me', label: L.decide, isDecide: true }
      ]));

      container.appendChild(buildSingleSelect('include_interactive', L.interactive, [
        { value: 'yes', label: L.interactive_yes },
        { value: 'no', label: L.interactive_no },
        { value: 'decide_for_me', label: L.decide, isDecide: true }
      ]));

      container.appendChild(buildSingleSelect('theme', L.theme, [
        { value: 'light', label: L.theme_light },
        { value: 'dark', label: L.theme_dark },
        { value: 'decide_for_me', label: L.decide, isDecide: true }
      ]));

      container.appendChild(buildSingleSelect('speaker_notes', L.notes, [
        { value: 'full_script', label: L.notes_full },
        { value: 'brief_talking_points', label: L.notes_brief },
        { value: 'no_notes', label: L.notes_none },
        { value: 'decide_for_me', label: L.decide, isDecide: true }
      ]));

      if (availableStats > 0) {
        var headlineQ = buildTextInput('headline_numbers', L.headline, L.headline_help);
        headlineQ.id = 'q-headline';
        container.appendChild(headlineQ);
      }

      var closingQ = buildTextInput('closing_ask', L.closing, L.closing_help);
      closingQ.id = 'q-closing';
      closingQ.classList.add('hidden');
      container.appendChild(closingQ);

      var techDomains = ['engineering', 'computer_science', 'medical'];
      if (techDomains.indexOf(detectedDomain) !== -1) {
        var diagQ = buildSingleSelect('diagrams', L.diagrams, [
          { value: 'build_svg', label: L.diagrams_svg },
          { value: 'placeholder', label: L.diagrams_placeholder },
          { value: 'minimal_text', label: L.diagrams_minimal },
          { value: 'decide_for_me', label: L.decide, isDecide: true }
        ]);
        diagQ.id = 'q-diagrams';
        container.appendChild(diagQ);
      }
    }

    // ============ STATE CHANGE ============

    function onStateChange() {
      var closingEl = document.getElementById('q-closing');
      if (closingEl) {
        var conferenceAudiences = ['academic_conference', 'mixed_academic_industry', 'professional'];
        var showClosing = conferenceAudiences.indexOf(state.audience) !== -1;
        closingEl.classList.toggle('hidden', !showClosing);
      }
    }

    // ============ SUBMIT ============

    function submitAnswers() {
      var emphasis = state.emphasis.length > 0 ? state.emphasis : ['decide_for_me'];
      var payload = {
        project_id: projectId,
        audience: state.audience,
        talk_duration_minutes: state.duration,
        narrative_emphasis: emphasis,
        title_style: state.title_style,
        include_interactive: state.include_interactive,
        theme: state.theme,
        speaker_notes: state.speaker_notes,
        headline_numbers: state.headline_numbers,
        closing_ask: state.closing_ask,
        diagrams: state.diagrams
      };

      var jsonStr = JSON.stringify(payload);

      if (tg && typeof tg.sendData === 'function') {
        tg.sendData(jsonStr);
      } else {
        console.log('Mini App data:', jsonStr);
        alert('Data sent (dev mode): ' + jsonStr);
      }
    }

    document.getElementById('submit-btn').addEventListener('click', submitAnswers);

    render();
  </script>
</body>
</html>
