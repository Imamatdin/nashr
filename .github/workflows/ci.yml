# Heavy verification that cannot run on the 8 GB workstation (ADR 0001 §11).
# Runs on pushes to ci/** branches and on manual dispatch only — never main.
# Test configuration only: no production secrets, no model or payment keys,
# MinIO stands in for R2, and every credential below is a local constant.
name: ci

on:
  push:
    branches: ["ci/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"

jobs:
  unit:
    name: unit tests, pyright, web tests, typecheck, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            packages/web/package-lock.json
            packages/presentation-worker/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Python tests
        run: |
          mkdir -p artifacts
          set -o pipefail
          python -m pytest tests/ -q -ra --junitxml=artifacts/pytest-unit.xml 2>&1 | tee artifacts/pytest-unit.log
      - name: pyright
        run: python -m pyright packages/ 2>&1 | tee artifacts/pyright.log; exit ${PIPESTATUS[0]}
      - name: Journey console classifier tests (B1-FIX3 N1, B1-FIX4)
        working-directory: scripts/webshots
        run: node --test console_rules.test.mjs console_rules_empty.test.mjs console_rules_empty_scope.test.mjs
      - name: Web unit tests, typecheck, production build
        working-directory: packages/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8090
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
      # B1-FIX2 item 8: the renderer suite, including PPTX determinism and the
      # Chromium-backed PDF renderer tests (RUN_PDF_TESTS=1).
      - name: Presentation worker tests and typecheck
        working-directory: packages/presentation-worker
        env:
          RUN_PDF_TESTS: "1"
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run typecheck
          set -o pipefail
          npm test 2>&1 | tee ../../artifacts/presentation-worker.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-logs
          path: artifacts/
          retention-days: 5

  postgres:
    name: real PostgreSQL + PostgREST
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-postgres
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NASHR_TEST_DATABASE_URL: postgresql://postgres:ci-postgres@127.0.0.1:5432/postgres
      NASHR_TEST_ARTIFACTS: artifacts
      JWT_SECRET: local-only-jwt-secret-not-for-production-0000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Cluster roles
        run: |
          mkdir -p artifacts
          psql "$NASHR_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/bootstrap_roles.sql
      - name: Pre-change run — bug tests must FAIL on migrations 001–015
        run: |
          set +e
          NASHR_TEST_SCHEMA=legacy python -m pytest tests/db/test_bug_regressions.py -v -ra \
            --junitxml=artifacts/prechange.xml 2>&1 | tee artifacts/prechange.log
          set -e
          python -m tests.db.expect_failures artifacts/prechange.xml tests/db/inventory_legacy.json \
            | tee artifacts/prechange-verdict.log
          exit ${PIPESTATUS[0]}
      - name: Pre-fix run — B1-FIX regressions must FAIL on 016 as reviewed
        run: |
          set +e
          NASHR_TEST_SCHEMA=baseline python -m pytest tests/db/test_b1_fix_regressions.py -v -ra \
            --junitxml=artifacts/prefix.xml 2>&1 | tee artifacts/prefix.log
          set -e
          python -m tests.db.expect_failures artifacts/prefix.xml tests/db/inventory_baseline.json \
            | tee artifacts/prefix-verdict.log
          exit ${PIPESTATUS[0]}
      - name: Pre-fix run — B1-FIX2 regressions must FAIL on 016 as of 8cc000b
        run: |
          set +e
          NASHR_TEST_SCHEMA=fix1 python -m pytest tests/db/test_b1_fix2_regressions.py -v -ra \
            --junitxml=artifacts/prefix2.xml 2>&1 | tee artifacts/prefix2.log
          set -e
          python -m tests.db.expect_failures artifacts/prefix2.xml tests/db/inventory_fix1.json \
            | tee artifacts/prefix2-verdict.log
          exit ${PIPESTATUS[0]}
      - name: Pre-fix run — B1-FIX3 regressions must FAIL on 016 as of fdb14bc
        run: |
          set +e
          NASHR_TEST_SCHEMA=fix2 python -m pytest tests/db/test_b1_fix3_regressions.py -v -ra \
            --junitxml=artifacts/prefix3.xml 2>&1 | tee artifacts/prefix3.log
          set -e
          python -m tests.db.expect_failures artifacts/prefix3.xml tests/db/inventory_fix2.json \
            | tee artifacts/prefix3-verdict.log
          exit ${PIPESTATUS[0]}
      - name: Pre-fix run — B1-FIX4 regressions must FAIL on 016 as of 3723d30
        run: |
          set +e
          NASHR_TEST_SCHEMA=fix3 python -m pytest tests/db/test_b1_fix4_regressions.py -v -ra \
            --junitxml=artifacts/prefix4.xml 2>&1 | tee artifacts/prefix4.log
          set -e
          python -m tests.db.expect_failures artifacts/prefix4.xml tests/db/inventory_fix3.json \
            | tee artifacts/prefix4-verdict.log
          exit ${PIPESTATUS[0]}
      # The barrier test is deterministic (Codex N2): it holds both writers after
      # they read the head and inspects their waits, so no schedule is left to chance.
      - name: Mutation run — the document-lock barrier test must FAIL with the row lock removed
        run: |
          set +e
          NASHR_TEST_MUTATION=no_document_lock python -m pytest tests/db/test_document_lock.py \
            -v -ra --junitxml=artifacts/mutation.xml 2>&1 | tee artifacts/mutation.log
          set -e
          python -m tests.db.expect_failures artifacts/mutation.xml tests/db/inventory_mutation.json \
            | tee artifacts/mutation-verdict.log
          exit ${PIPESTATUS[0]}
      - name: Post-change run — full suite on migrations 001–016
        run: |
          set -o pipefail
          python -m pytest tests/db -v -ra -s --junitxml=artifacts/postgres.xml 2>&1 | tee artifacts/postgres.log
      - name: SQL harness
        run: |
          python -m tests.db.migrate nashr_sql
          psql "postgresql://postgres:ci-postgres@127.0.0.1:5432/nashr_sql" -v ON_ERROR_STOP=1 \
            -f tests/sql/document_functions.sql 2>&1 | tee artifacts/sql-harness.log
      - name: PostgREST on a migrated database
        run: |
          python -m tests.db.migrate nashr_rest
          docker run -d --name postgrest --network host -e PGRST_SERVER_HOST=127.0.0.1 \
            -e PGRST_DB_URI="postgres://authenticator:local-authenticator@127.0.0.1:5432/nashr_rest" \
            -e PGRST_DB_SCHEMAS=public -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$JWT_SECRET" -e PGRST_SERVER_PORT=3000 \
            postgrest/postgrest:v12.2.3
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
      - name: Isolation through PostgREST with user tokens
        env:
          NASHR_TEST_POSTGREST_URL: http://127.0.0.1:3000
          NASHR_TEST_JWT_SECRET: ${{ env.JWT_SECRET }}
          NASHR_TEST_REST_DATABASE_URL: postgresql://postgres:ci-postgres@127.0.0.1:5432/nashr_rest
        run: |
          set -o pipefail
          python -m pytest tests/db/test_postgrest.py -v -ra --junitxml=artifacts/postgrest.xml 2>&1 \
            | tee artifacts/postgrest.log
      - name: PostgREST log
        if: always()
        run: docker logs postgrest > artifacts/postgrest-server.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-logs
          path: artifacts/
          retention-days: 5

  journey:
    name: browser journey (API + worker + next start)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # fixtures.py builds its PDF fixtures with reportlab (test-only, not in the image)
          pip install -r requirements-dev.txt
      - name: Local stack (Postgres + migrations + PostgREST + Caddy)
        run: |
          mkdir -p artifacts
          bash scripts/local_stack/up.sh 2>&1 | tee artifacts/stack.log
      # S3 stand-in is a community MinIO rebuild because upstream stopped publishing
      # images; replace with an official-publisher image (e.g. Chainguard) if one is
      # adopted. Pinned by digest, CI only: never used by the local stack or anything
      # in the handover, and this job gets only throwaway loopback credentials (no R2,
      # model, payment or deploy secrets).
      - name: MinIO as the R2 stand-in
        run: |
          docker run -d --name s3 -p 127.0.0.1:54322:9000 \
            -e MINIO_ROOT_USER=local-access -e MINIO_ROOT_PASSWORD=local-secret \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 \
            server /data
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:54322/minio/health/live && break; sleep 1; done
          python - <<'PY'
          import boto3
          s3 = boto3.client("s3", endpoint_url="http://127.0.0.1:54322",
                            aws_access_key_id="local-access", aws_secret_access_key="local-secret",
                            region_name="us-east-1")
          s3.create_bucket(Bucket="nashr-local")
          PY
      - name: Test environment
        run: |
          python scripts/local_stack/local_env.py | sed -e "s/^export //" -e "s/'//g" >> "$GITHUB_ENV"
          echo "TELEGRAM_BOT_TOKEN=0:ci-placeholder" >> "$GITHUB_ENV"
      - name: Start API and worker
        run: |
          API_HOST=127.0.0.1 nohup python -m packages.api.run > artifacts/api.log 2>&1 &
          nohup python scripts/worker_run_job.py --loop > artifacts/worker.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8090/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8090/health
      - name: Build and start the web app (next build + next start)
        working-directory: packages/web
        run: |
          npm ci
          npm run build 2>&1 | tee ../../artifacts/next-build.log
          nohup npx next start -H 127.0.0.1 -p 3100 > ../../artifacts/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3100/ >/dev/null && break; sleep 1; done
      - name: Seed and fixtures
        run: |
          python scripts/local_stack/seed.py > artifacts/seed.json
          python scripts/local_stack/fixtures.py artifacts/fixtures
      - name: Playwright journey (headless, one worker)
        working-directory: scripts/webshots
        env:
          JOURNEY_RECORD: "1"
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node evidence_journey.mjs ../../artifacts/seed.json ../../artifacts/fixtures ../../artifacts/journey
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-artifacts
          path: |
            artifacts/
            !artifacts/seed.json
          retention-days: 5

  prefix-fdb14bc:
    name: pre-fix — B1-FIX3 unit, web and console regressions must FAIL on fdb14bc
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The application is the B1-FIX2 review's SHA; the tests stay current.
      - name: The app as of fdb14bc
        run: |
          # Files added since fdb14bc go (or the "old" app imports new modules),
          # except the new tests themselves.
          git diff --name-only --diff-filter=A fdb14bc HEAD -- packages scripts/worker_run_job.py \
            | grep -v '\.test\.ts$' | xargs -r rm -f
          git checkout fdb14bc -- packages scripts/worker_run_job.py
          git diff --stat fdb14bc -- packages scripts/worker_run_job.py | tail -1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          # node --test's junit reporter
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Unit regressions must FAIL on fdb14bc
        run: |
          mkdir -p artifacts
          set +e
          python -m pytest tests/unit/test_b1_fix3_regressions.py -v -ra \
            --junitxml=artifacts/prefix-unit.xml 2>&1 | tee artifacts/prefix-unit.log
          set -e
          python -m tests.db.expect_failures artifacts/prefix-unit.xml tests/prefix/unit_fix2.json \
            | tee artifacts/prefix-unit-verdict.log
          exit ${PIPESTATUS[0]}
      - name: Web regressions must FAIL on fdb14bc
        working-directory: packages/web
        run: |
          npm ci
          set +e
          npx vitest run lib/use-live-job.test.ts --reporter=junit \
            --outputFile=../../artifacts/prefix-web.xml 2>&1 | tee ../../artifacts/prefix-web.log
          set -e
          cd ../.. && python -m tests.db.expect_failures artifacts/prefix-web.xml \
            tests/prefix/web_fix2.json | tee artifacts/prefix-web-verdict.log
          exit ${PIPESTATUS[0]}
      - name: Console classifier regressions must FAIL on fdb14bc's rules
        working-directory: scripts/webshots
        run: |
          set +e
          CONSOLE_RULES=./prefix/console_rules_fdb14bc.mjs node --test --test-reporter=junit \
            --test-reporter-destination=../../artifacts/prefix-console.xml console_rules.test.mjs
          set -e
          cd ../.. && python -m tests.db.expect_failures artifacts/prefix-console.xml \
            tests/prefix/console_fix2.json | tee artifacts/prefix-console-verdict.log
          exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prefix-fdb14bc-logs
          path: artifacts/
          retention-days: 5

  prefix-3723d30:
    name: pre-fix — B1-FIX4 unit and console regressions must FAIL on 3723d30
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The application is the B1-FIX3 review's SHA; the tests stay current.
      - name: The app as of 3723d30
        run: |
          # Files added since 3723d30 go (or the "old" app imports new modules).
          git diff --name-only --diff-filter=A 3723d30 HEAD -- packages scripts/worker_run_job.py \
            | grep -v '\.test\.ts$' | xargs -r rm -f
          git checkout 3723d30 -- packages scripts/worker_run_job.py
          git diff --stat 3723d30 -- packages scripts/worker_run_job.py | tail -1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          # node --test's junit reporter
          node-version: "22"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Unit regressions must FAIL on 3723d30
        run: |
          mkdir -p artifacts
          set +e
          python -m pytest tests/unit/test_b1_fix4_regressions.py -v -ra \
            --junitxml=artifacts/prefix-unit.xml 2>&1 | tee artifacts/prefix-unit.log
          set -e
          python -m tests.db.expect_failures artifacts/prefix-unit.xml tests/prefix/unit_fix3.json \
            | tee artifacts/prefix-unit-verdict.log
          exit ${PIPESTATUS[0]}
      - name: Console classifier regressions must FAIL on 3723d30's rules
        working-directory: scripts/webshots
        run: |
          set +e
          CONSOLE_RULES=./prefix/console_rules_3723d30.mjs node --test --test-reporter=junit \
            --test-reporter-destination=../../artifacts/prefix-console.xml \
            console_rules_empty_scope.test.mjs
          set -e
          cd ../.. && python -m tests.db.expect_failures artifacts/prefix-console.xml \
            tests/prefix/console_fix3.json | tee artifacts/prefix-console-verdict.log
          exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prefix-3723d30-logs
          path: artifacts/
          retention-days: 5

  journey-prefix:
    name: browser journey pre-fix (${{ matrix.only }} steps must FAIL on ${{ matrix.ref }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # B1-FIX2's delivery steps against the B1-FIX review's SHA
          - ref: 8cc000b
            only: delivery
            inventory: journey_inventory_fix1.json
          # B1-FIX3's first-sight step against the B1-FIX2 review's SHA (Codex A4)
          - ref: fdb14bc
            only: fix3
            inventory: journey_inventory_fix2.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The app under test is a reviewed SHA; the journey, its fixture and the
      # local stack stay current. The fixture adapts to each SHA's 016.
      - name: The app as of ${{ matrix.ref }}
        run: |
          # checkout restores the old files but keeps files added since; remove
          # those too, or the "old" app still builds against new modules.
          git diff --name-only --diff-filter=A ${{ matrix.ref }} HEAD -- packages supabase \
            | xargs -r rm -f
          git checkout ${{ matrix.ref }} -- packages supabase scripts/worker_run_job.py
          git diff --stat ${{ matrix.ref }} -- packages supabase scripts/worker_run_job.py | tail -1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # fixtures.py builds its PDF fixtures with reportlab (test-only, not in the image)
          pip install -r requirements-dev.txt
      - name: Local stack (Postgres + migrations + PostgREST + Caddy)
        run: |
          mkdir -p artifacts
          bash scripts/local_stack/up.sh 2>&1 | tee artifacts/stack.log
      # S3 stand-in is a community MinIO rebuild because upstream stopped publishing
      # images; replace with an official-publisher image (e.g. Chainguard) if one is
      # adopted. Pinned by digest, CI only: never used by the local stack or anything
      # in the handover, and this job gets only throwaway loopback credentials (no R2,
      # model, payment or deploy secrets).
      - name: MinIO as the R2 stand-in
        run: |
          docker run -d --name s3 -p 127.0.0.1:54322:9000 \
            -e MINIO_ROOT_USER=local-access -e MINIO_ROOT_PASSWORD=local-secret \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 \
            server /data
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:54322/minio/health/live && break; sleep 1; done
          python - <<'PY'
          import boto3
          s3 = boto3.client("s3", endpoint_url="http://127.0.0.1:54322",
                            aws_access_key_id="local-access", aws_secret_access_key="local-secret",
                            region_name="us-east-1")
          s3.create_bucket(Bucket="nashr-local")
          PY
      - name: Test environment
        run: |
          python scripts/local_stack/local_env.py | sed -e "s/^export //" -e "s/'//g" >> "$GITHUB_ENV"
          echo "TELEGRAM_BOT_TOKEN=0:ci-placeholder" >> "$GITHUB_ENV"
      - name: Start API and worker
        run: |
          API_HOST=127.0.0.1 nohup python -m packages.api.run > artifacts/api.log 2>&1 &
          nohup python scripts/worker_run_job.py --loop > artifacts/worker.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8090/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8090/health
      - name: Build and start the web app (next build + next start)
        working-directory: packages/web
        run: |
          npm ci
          npm run build 2>&1 | tee ../../artifacts/next-build.log
          nohup npx next start -H 127.0.0.1 -p 3100 > ../../artifacts/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3100/ >/dev/null && break; sleep 1; done
      - name: Seed and fixtures
        run: |
          python scripts/local_stack/seed.py > artifacts/seed.json
          python scripts/local_stack/fixtures.py artifacts/fixtures
      - name: Playwright ${{ matrix.only }} steps — must FAIL on ${{ matrix.ref }}
        working-directory: scripts/webshots
        env:
          JOURNEY_RECORD: "1"
          JOURNEY_ONLY: ${{ matrix.only }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          set +e
          node evidence_journey.mjs ../../artifacts/seed.json ../../artifacts/fixtures ../../artifacts/journey
          set -e
          python expect_journey.py ../../artifacts/journey/results.json ${{ matrix.inventory }} \
            | tee ../../artifacts/journey-prefix-verdict.log
          exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-prefix-${{ matrix.ref }}-artifacts
          path: |
            artifacts/
            !artifacts/seed.json
          retention-days: 5

  minutes:
    name: minutes used
    if: always()
    needs: [unit, postgres, prefix-fdb14bc, prefix-3723d30, journey, journey-prefix]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Report billable minutes per job (rounded up per job, as GitHub bills)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '.jobs[] | select(.completed_at != null) | [.name, .started_at, .completed_at] | @tsv' \
            > jobs.tsv
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import csv, math
          from datetime import datetime
          rows, total = [], 0
          for name, start, end in csv.reader(open("jobs.tsv"), delimiter="\t"):
              span = datetime.fromisoformat(end.replace("Z", "+00:00")) - datetime.fromisoformat(start.replace("Z", "+00:00"))
              minutes = max(1, math.ceil(span.total_seconds() / 60))
              total += minutes
              rows.append(f"| {name} | {span.total_seconds():.0f}s | {minutes} |")
          print("| job | wall time | billable minutes |\n|---|---|---|")
          print("\n".join(rows))
          print(f"| **total (excluding this report job)** | | **{total}** |")
          PY
